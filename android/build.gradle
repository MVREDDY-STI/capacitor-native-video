apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace "com.solum.nativevideo"
  compileSdkVersion 34

  defaultConfig {
    minSdkVersion 21
    targetSdkVersion 34
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // Provided by the host Capacitor app
  compileOnly project(':capacitor-android')
  compileOnly project(':capacitor-cordova-android-plugins')

  // Capacitor's Plugin.activity is typed as AppCompatActivity. Keep this on the
  // plugin classpath so Kotlin can compile even when the host app does not
  // expose AppCompat transitively to local plugin modules.
  compileOnly "androidx.appcompat:appcompat:1.6.1"

  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

  // ExoPlayer (media3) — hardware-accelerated HEVC/H.264 playback. minSdk 21+.
  def media3 = "1.3.1"
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-ui:$media3"
}
